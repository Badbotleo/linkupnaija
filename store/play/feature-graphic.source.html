<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden}
body{background:#0B0B0F;font-family:'Plus Jakarta Sans',Arial,sans-serif;color:#FBFBF8;
  display:flex;align-items:center;gap:40px;padding:0 72px;position:relative}
/* A soft brand glow so the panel is not a flat rectangle, drawn rather than
   imported: Play rejects a feature graphic with transparency. */
.glow{position:absolute;right:-120px;top:-140px;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,#534AB7 0%,rgba(83,74,183,0.35) 45%,rgba(83,74,183,0) 70%)}
.mark{position:relative;flex:0 0 auto}
.copy{position:relative;min-width:0}
h1{font-size:62px;font-weight:800;letter-spacing:-2.4px;line-height:1.02}
p{font-size:26px;line-height:1.35;color:#CFCCE6;margin-top:16px;max-width:560px}
.rule{width:92px;height:6px;background:#FAC775;border-radius:3px;margin-top:26px}
</style></head><body>
<div class="glow"></div>
<div class="mark">
<svg viewBox="0 0 48 48" width="168" height="168" xmlns="http://www.w3.org/2000/svg">
<circle cx="24" cy="24" r="22" fill="#534AB7"/><circle cx="24" cy="24" r="17.6" fill="#3C3489"/>
<circle cx="24" cy="17.4" r="5.1" fill="#AFA9EC"/><path d="M17.3 32v-2.4a6.7 6.7 0 0 1 13.4 0V32z" fill="#AFA9EC"/>
<circle cx="13.9" cy="21.6" r="4.5" fill="#FFFFFF"/><path d="M7.9 32v-2a6 6 0 0 1 12 0v2z" fill="#FFFFFF"/>
<circle cx="34.1" cy="21.6" r="4.5" fill="#FFFFFF"/><path d="M28.1 32v-2a6 6 0 0 1 12 0v2z" fill="#FFFFFF"/></svg>
</div>
<div class="copy">
  <h1>Link<span style="color:#7C72DC">Up</span>Naija</h1>
  <p>Find your people, and know who else will be there before you go.</p>
  <div class="rule"></div>
</div>
</body></html>

<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
/*
 * Post 1, and the one that leads, because it is the only claim in the product
 * that no other events app in Nigeria makes. Everything else we do (tickets,
 * rides, circles) somebody else also does.
 *
 * The headline is the bad night, not the feature. An earlier cut said "Know
 * who is going before you go", which is a description of a settings screen.
 * Nobody has ever felt "I lack visibility into attendance"; what they felt was
 * standing by the bar at 9:40 with a drink they paid for, deciding whether
 * leaving this early is embarrassing. That is the sentence that goes at 124px.
 * The product arrives afterwards, as the thing that would have prevented it.
 *
 * Cream, and the only cream in the set. A Nigerian feed is wall to wall
 * saturated flyers on black; the thing that stops a thumb there is paper.
 * It also puts the lockup at the TOP with the headline running to the floor,
 * so the post reads as a page rather than a slide.
 */
html, body { width: 1080px; height: 1080px; }
.stage { padding: 88px 96px 92px; }

/* A single cool bloom, kept faint. On cream a strong one turns to mud. */
.bloom {
  position: absolute; width: 900px; height: 900px; border-radius: 50%;
  top: -300px; right: -280px; pointer-events: none;
  background: radial-gradient(circle, rgba(83,74,183,0.26) 0%, rgba(83,74,183,0.08) 45%, rgba(83,74,183,0) 70%);
}

.masthead {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 32px; border-bottom: 1px solid var(--hair);
}

/* Sized by the LONGEST line, not by taste. "You knew nobody." is 16
   characters, and at 124px that set 912px into an 888px column, so the last
   word wrapped, the headline became four lines and the avatar stack fell off
   the bottom of the canvas. 102 is the largest size at which all three lines
   hold. */
h1 { font-size: 102px; margin-top: 64px; letter-spacing: -3.8px; }
.sub { font-size: 30px; margin-top: 34px; max-width: 740px; }

/* The avatar stack is the headline restated as a picture, and it sits on the
   floor of the post rather than in the middle of it. Initials, not stock
   faces: a fake crowd of stock photography is the exact thing the copy is
   promising not to be. */
.evidence { margin-top: auto; }
.evidence .fix { display: block; padding-bottom: 24px; }
.going { display: flex; align-items: center; gap: 28px; }
.stack { display: flex; }
.av {
  width: 108px; height: 108px; border-radius: 50%; margin-left: -30px;
  display: grid; place-items: center; font-size: 40px; font-weight: 800;
  border: 6px solid var(--bg); color: #14121E; letter-spacing: -1px;
}
.av:first-child { margin-left: 0; }
.av.more { background: #14121E; color: #F3EFE6; font-size: 31px; }
.going .label { font-size: 30px; font-weight: 600; color: var(--muted); line-height: 1.26; }
.going .label b { color: var(--ink); font-weight: 800; }
</style></head><body class="field-cream">
<div class="bloom"></div>
<div class="stage">

  <div class="masthead">
    <span class="lockup">
      <svg viewBox="0 0 48 48" width="62" height="62" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" fill="#534AB7"/><circle cx="24" cy="24" r="17.6" fill="#3C3489"/>
        <circle cx="24" cy="17.4" r="5.1" fill="#AFA9EC"/><path d="M17.3 32v-2.4a6.7 6.7 0 0 1 13.4 0V32z" fill="#AFA9EC"/>
        <circle cx="13.9" cy="21.6" r="4.5" fill="#FFFFFF"/><path d="M7.9 32v-2a6 6 0 0 1 12 0v2z" fill="#FFFFFF"/>
        <circle cx="34.1" cy="21.6" r="4.5" fill="#FFFFFF"/><path d="M28.1 32v-2a6 6 0 0 1 12 0v2z" fill="#FFFFFF"/>
      </svg>
      <span class="wordmark">Link<span style="color:#534AB7">Up</span>Naija</span>
    </span>
    <span class="handle">linkupnaija.com</span>
  </div>

  <h1>You paid<span class="pd">.</span><br>You showed up<span class="pd">.</span><br><span class="accent">You knew nobody<span class="pd">.</span></span></h1>

  <p class="sub">That is the Saturday nobody posts about. Here you see who has
  already said they are going, and which of them you know, before you spend a
  naira.</p>

  <div class="evidence">
    <span class="fix">On every event, before you book</span>
    <div class="going">
      <div class="stack">
        <div class="av" style="background:#FAC775">T</div>
        <div class="av" style="background:#AFA9EC">A</div>
        <div class="av" style="background:#6FD9A6">K</div>
        <div class="av" style="background:#F6A5A5">N</div>
        <div class="av more">+41</div>
      </div>
      <div class="label"><b>45 going</b><br>7 you know</div>
    </div>
  </div>

</div>
<div class="grain"></div>
</body></html>

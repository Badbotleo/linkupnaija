<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
/*
 * The ease-of-purchase post, and the leg the other five ignored. Posts 1, 3
 * and 5 argue benefit, post 2 argues price, post 4 announces the app. None of
 * them say how little work any of it is, which matters because buying a ticket
 * in this market usually means a DM, a transfer to somebody's personal
 * account, a screenshot, and a wait.
 *
 * So the argument is subtraction, not addition: three things you are not being
 * asked to do, struck out, and one line of what actually happens. Nothing else
 * in the set is built as a list of removals, and nothing else is gold.
 *
 * On the claim: Paystack inline is what runs the charge (lib/paystack.ts), and
 * which methods a buyer is offered comes from the channels enabled on the
 * Paystack account rather than from anything this code passes. Card and bank
 * transfer are the two named here because those are the ones standing on a
 * default account. Do not add USSD to this graphic without turning it on and
 * looking at a real checkout first.
 */
html, body { width: 1080px; height: 1080px; }
.stage { padding: 88px 96px 92px; }

/* Gold is already hot, so the bloom here cools rather than warms: a wash of
   brand purple at low opacity, which keeps the field from going flat without
   turning it orange. */
.bloom {
  position: absolute; width: 1100px; height: 1000px; border-radius: 50%;
  top: -340px; right: -300px; pointer-events: none;
  background: radial-gradient(circle, rgba(83,74,183,0.30) 0%, rgba(83,74,183,0.09) 46%, rgba(83,74,183,0) 70%);
}

/* Sized by the longest line again: "you to screenshot" is 17 characters and
   has to hold inside an 888px column. */
h1 { font-size: 92px; margin-top: 40px; letter-spacing: -3.2px; }

/* The removals. Struck through in the ink colour rather than greyed out,
   because a grey list reads as disabled UI; a struck list reads as somebody
   crossing things off. */
.nots { margin-top: 46px; }
.nots li {
  list-style: none; display: flex; align-items: center; gap: 20px;
  font-size: 34px; font-weight: 700; color: var(--muted);
  padding: 9px 0;
}
.nots li .x {
  width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto;
  background: rgba(20,18,30,0.14); display: grid; place-items: center;
}
.nots li s { text-decoration-thickness: 3px; text-decoration-color: rgba(20,18,30,0.55); }

/* The one thing that does happen, in the dark bar that every other post in
   the set uses for its payoff number. */
.does {
  margin-top: 44px; background: #14121E; color: #FBF8F2;
  border-radius: 22px; padding: 30px 40px;
  display: flex; align-items: center; gap: 24px;
  font-size: 32px; font-weight: 800; letter-spacing: -0.6px;
}
.does .tick { width: 40px; height: 40px; border-radius: 50%; background: #FAC775; display: grid; place-items: center; flex: 0 0 auto; }

.foot { margin-top: auto; }
</style></head><body class="field-gold">
<div class="bloom"></div>
<div class="stage">

  <div><span class="eyebrow pill">Buying a ticket</span></div>

  <h1>Nobody is asking<br>you to screenshot<br>your <span class="accent">transfer<span class="pd">.</span></span></h1>

  <ul class="nots">
    <li><span class="x"><svg width="15" height="15" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="#14121E" stroke-width="2.6" stroke-linecap="round"/></svg></span><s>DM for the account details</s></li>
    <li><span class="x"><svg width="15" height="15" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="#14121E" stroke-width="2.6" stroke-linecap="round"/></svg></span><s>Transfer to somebody&rsquo;s personal account</s></li>
    <li><span class="x"><svg width="15" height="15" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="#14121E" stroke-width="2.6" stroke-linecap="round"/></svg></span><s>Send proof of payment and wait</s></li>
  </ul>

  <div class="does">
    <span class="tick"><svg width="20" height="20" viewBox="0 0 16 16"><path d="M2 8.5l4 4 8-9" stroke="#14121E" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    Card or bank transfer. Ticket straight away.
  </div>

  <div class="foot">
    <span class="lockup">
      <svg viewBox="0 0 48 48" width="60" height="60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" fill="#534AB7"/><circle cx="24" cy="24" r="17.6" fill="#3C3489"/>
        <circle cx="24" cy="17.4" r="5.1" fill="#AFA9EC"/><path d="M17.3 32v-2.4a6.7 6.7 0 0 1 13.4 0V32z" fill="#AFA9EC"/>
        <circle cx="13.9" cy="21.6" r="4.5" fill="#FFFFFF"/><path d="M7.9 32v-2a6 6 0 0 1 12 0v2z" fill="#FFFFFF"/>
        <circle cx="34.1" cy="21.6" r="4.5" fill="#FFFFFF"/><path d="M28.1 32v-2a6 6 0 0 1 12 0v2z" fill="#FFFFFF"/>
      </svg>
      <span class="wordmark">Link<span style="color:#534AB7">Up</span>Naija</span>
    </span>
    <span class="handle">linkupnaija.com</span>
  </div>

</div>
<div class="grain"></div>
</body></html>

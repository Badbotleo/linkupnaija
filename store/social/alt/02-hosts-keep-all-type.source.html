<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
/*
 * SECOND BUILD. The posted version argued with a ticket stub on purple; this
 * one throws the object away and lets the two numbers be the entire post.
 *
 * The idea is repetition, not illustration. "You list" and "You receive" are
 * set at the same size, in the same weight, with the SAME GLYPHS underneath
 * them, so the eye checks the claim before the brain reads a word of it. Every
 * ticketing platform in this market calls itself low fee; a host stopped
 * believing the phrase years ago, and two identical figures are an argument
 * they can verify in one second without trusting us at all.
 *
 * Cream rather than purple, because the numbers have to carry the whole
 * canvas and black type on paper is the most legible thing we own.
 *
 * The numbers are not decoration: BUYER_FEE_PERCENT is 9 and it is added on
 * top of the host's price, not taken out of it (lib/pricing.ts). If that
 * constant ever changes, this post is wrong and has to be re-rendered.
 */
html, body { width: 1080px; height: 1080px; }
.stage { padding: 80px 96px 84px; }

.bloom {
  position: absolute; width: 900px; height: 900px; border-radius: 50%;
  top: -320px; right: -300px; pointer-events: none;
  background: radial-gradient(circle, rgba(83,74,183,0.24) 0%, rgba(83,74,183,0.07) 45%, rgba(83,74,183,0) 70%);
}

/* The pain, stated once and small, so it does not compete with the figures.
   It describes the deduction model this market runs on, which is also what we
   ran on until 1 Sep 2026. No competitor is named and none should be. */
.pain { font-size: 46px; font-weight: 800; letter-spacing: -1.4px; line-height: 1.14; margin-top: 30px; max-width: 840px; }

.block { margin-top: 38px; }
.block .k { font-size: 30px; font-weight: 700; color: var(--dim); letter-spacing: 2.6px; text-transform: uppercase; }
.block .n { font-size: 148px; font-weight: 800; letter-spacing: -6px; line-height: 1.02; margin-top: 2px; }
.block.paid .n { color: #534AB7; }

/* The fee, on its own rule between the two figures, because the whole point
   is that it sits OUTSIDE the host's number rather than inside it. */
.fee {
  margin-top: 30px; padding: 22px 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair);
  display: flex; align-items: baseline; justify-content: space-between;
}
.fee .l { font-size: 27px; font-weight: 700; color: var(--muted); }
.fee .l small { display: block; font-size: 22px; font-weight: 600; color: var(--dim); margin-top: 4px; }
.fee .r { font-size: 34px; font-weight: 800; color: var(--muted); }

.foot { margin-top: auto; }
</style></head><body class="field-cream">
<div class="bloom"></div>
<div class="stage">

  <div><span class="eyebrow pill">For hosts</span></div>

  <p class="pain">The number on your flyer is never<br>the number that lands<span class="pd">.</span></p>

  <div class="block">
    <div class="k">You list at</div>
    <div class="n">₦10<span class="cm">,</span>000</div>
  </div>

  <div class="fee">
    <span class="l">Booking fee<small>9%, added on top, paid by the buyer</small></span>
    <span class="r">₦900</span>
  </div>

  <div class="block paid">
    <div class="k">You receive</div>
    <div class="n">₦10<span class="cm">,</span>000</div>
  </div>

  <div class="foot">
    <span class="lockup">
      <svg viewBox="0 0 48 48" width="58" height="58" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" fill="#534AB7"/><circle cx="24" cy="24" r="17.6" fill="#3C3489"/>
        <circle cx="24" cy="17.4" r="5.1" fill="#AFA9EC"/><path d="M17.3 32v-2.4a6.7 6.7 0 0 1 13.4 0V32z" fill="#AFA9EC"/>
        <circle cx="13.9" cy="21.6" r="4.5" fill="#FFFFFF"/><path d="M7.9 32v-2a6 6 0 0 1 12 0v2z" fill="#FFFFFF"/>
        <circle cx="34.1" cy="21.6" r="4.5" fill="#FFFFFF"/><path d="M28.1 32v-2a6 6 0 0 1 12 0v2z" fill="#FFFFFF"/>
      </svg>
      <span class="wordmark">Link<span style="color:#534AB7">Up</span>Naija</span>
    </span>
    <span class="handle">List your event free</span>
  </div>

</div>
<div class="grain"></div>
</body></html>

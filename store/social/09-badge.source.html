<style>
/*
 * THE BADGE. Premium, and the only post in the set selling trust rather than
 * a feature.
 *
 * From app/premium/page.tsx: Premium is ₦4,999 a month and it buys the top of
 * the feed, event analytics, hosting without a limit, and the gold badge. The
 * badge leads here for the reason the page itself gives: on a platform built
 * on people deciding whether to trust a stranger with their money and their
 * Saturday, a badge is not a vanity item. It is granted after somebody on the
 * team checks, not on payment.
 *
 * THAT DISTINCTION IS THE WHOLE POST AND IT MUST NOT BE SOFTENED. "Pay and
 * get verified" is what every badge in this market means and it is why nobody
 * believes them. The moment this graphic implies money alone buys it, the
 * badge is worth nothing and the post has done real damage.
 *
 * CENTRED, which nothing else in the set now is, and built around one object
 * at a size no other post uses. A trust mark argued in a corner is not
 * argued at all.
 */

}

.mark { margin-top: 44px; position: relative; }
.mark .halo {

  margin: -260px 0 0 -260px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(250,199,117,0.34) 0%, rgba(250,199,117,0.07) 48%, rgba(250,199,117,0) 70%);
}

h1 { font-size: 78px; margin-top: 44px; letter-spacing: -2.7px; }

  font-size: 25px; font-weight: 700; color: #FAC775; letter-spacing: -0.2px;
}

.foot { margin-top: auto; width: 100%; }

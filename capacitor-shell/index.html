<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LinkUpNaija</title>
    <!--
      THE ONLY FILE BUNDLED INTO THE APP.

      Everything else loads from www.linkupnaija.com, so this is what a member
      sees when that cannot be reached: on a Nigerian network that is a normal
      Tuesday, not an edge case, and the alternative is a white rectangle with
      no explanation and no way out.

      Deliberately self-contained. No fonts, no scripts from anywhere, no
      stylesheet: if the network is the thing that failed, every one of those
      is another request that will not come back.
    -->
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        background: #f7f7f9;
        color: #1a1040;
        font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b0b0f; color: #f4f4f7; }
        .sub { color: #a8a8b8 !important; }
      }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 20px;
        border-radius: 18px; background: #534ab7;
        display: grid; place-items: center;
        color: #fff; font-weight: 800; font-size: 26px; letter-spacing: -1px;
      }
      h1 { margin: 0 0 8px; font-size: 21px; font-weight: 800; letter-spacing: -0.5px; }
      .sub { margin: 0 auto; max-width: 30ch; color: #5c5c6b; font-size: 15px; }
      button {
        margin-top: 24px; padding: 13px 28px; border: 0; border-radius: 999px;
        background: #534ab7; color: #fff; font: 700 15px/1 inherit;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">LU</div>
      <h1>No connection</h1>
      <p class="sub">
        LinkUpNaija needs the internet to show you what is on. Check your data
        or WiFi and try again.
      </p>
      <button type="button" onclick="location.replace('https://www.linkupnaija.com/')">
        Try again
      </button>
    </main>
  </body>
</html>
